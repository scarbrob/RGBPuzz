version: 2

updates:
  # One ecosystem entry per package, since this is a polyrepo-style layout with
  # three independent lockfiles and no root package.json.
  - package-ecosystem: npm
    directory: /shared
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      shared-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
