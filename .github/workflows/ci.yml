name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix api
          npm ci --prefix frontend

      - name: Build shared
        run: npm run build --prefix shared

      - name: Lint shared
        run: npm run lint --prefix shared

      - name: Typecheck & build API
        run: npm run build --prefix api

      - name: Lint API
        run: npm run lint --prefix api

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Unit tests (frontend)
        run: npm test --prefix frontend

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.rgbpuzz.com/api
        run: npm run build --prefix frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  unit:
    name: Unit tests (shared + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix api

      - name: Run shared unit tests
        run: npm test --prefix shared

      - name: Run API unit tests
        run: npm test --prefix api

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix frontend

      - name: Resolve Playwright version
        id: pw
        run: |
          v=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install system deps (cached browser path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.rgbpuzz.com/api
        run: |
          npm run build --prefix shared
          npm run build --prefix frontend

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Fails on critical only. Dependabot (.github/dependabot.yml) handles the
      # steady stream of high-severity transitive advisories; blocking every PR
      # on those trains people to ignore the job, which is worse than not having
      # it. `continue-on-error` was doing exactly that -- the job could never
      # fail, so it reported nothing.
      - name: Audit (critical)
        run: |
          failed=0
          for d in shared api frontend; do
            echo "::group::npm audit $d"
            npm audit --prefix "$d" --audit-level=critical || failed=1
            echo "::endgroup::"
          done
          exit $failed
