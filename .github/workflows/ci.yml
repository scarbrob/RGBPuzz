name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            api/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix api
          npm ci --prefix frontend

      - name: Build shared
        run: npm run build --prefix shared

      - name: Typecheck & build API
        run: npm run build --prefix api

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.rgbpuzz.com/api
        run: npm run build --prefix frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit (high+)
        run: |
          for d in shared api frontend; do
            echo "::group::npm audit $d"
            npm audit --prefix "$d" --audit-level=high || echo "audit findings in $d"
            echo "::endgroup::"
          done
