<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#bg)"/>
  
  <!-- 5 color tiles arranged horizontally -->
  <rect x="12" y="32" width="13" height="36" rx="4" fill="#ff6b6b"/>
  <rect x="28" y="32" width="13" height="36" rx="4" fill="#feca57"/>
  <rect x="44" y="32" width="13" height="36" rx="4" fill="#48dbfb"/>
  <rect x="60" y="32" width="13" height="36" rx="4" fill="#ff9ff3"/>
  <rect x="76" y="32" width="13" height="36" rx="4" fill="#54a0ff"/>
  
  <!-- Glossy overlay on each tile -->
  <rect x="12" y="32" width="13" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="28" y="32" width="13" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="44" y="32" width="13" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="60" y="32" width="13" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
  <rect x="76" y="32" width="13" height="12" rx="4" fill="rgba(255,255,255,0.25)"/>
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
</svg>
